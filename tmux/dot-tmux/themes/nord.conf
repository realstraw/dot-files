# Nord for tmux 3.8: theme colours update when the terminal reports a change.
set -s theme detect

# Polar Night and Snow Storm neutrals.
set -s dark-theme-black "#3B4252"
set -s dark-theme-white "#E5E9F0"
set -s dark-theme-light-grey "#E5E9F0"
set -s dark-theme-dark-grey "#4C566A"
set -s light-theme-black "#2E3440"
set -s light-theme-white "#ECEFF4"
set -s light-theme-light-grey "#D8DEE9"
set -s light-theme-dark-grey "#4C566A"

# Frost accents, with Aurora orange for zoom and selection highlights.
set -s dark-theme-blue "#81A1C1"
set -s dark-theme-cyan "#88C0D0"
set -s light-theme-blue "#5E81AC"
set -s light-theme-cyan "#5E81AC"
set -s dark-theme-yellow "#D08770"
set -s light-theme-yellow "#D08770"
set -s dark-theme-green "#A3BE8C"
set -s light-theme-green "#A3BE8C"
set -s dark-theme-red "#BF616A"
set -s light-theme-red "#BF616A"
set -s dark-theme-magenta "#B48EAD"
set -s light-theme-magenta "#B48EAD"

# Styles follow the client theme, including explicit `set -s theme light/dark`.
set -g @nord-is-light '#{||:#{==:#{theme},light},#{&&:#{==:#{theme},detect},#{==:#{client_theme},light}}}'
set -g @nord-bg '#{?#{E:@nord-is-light},##D8DEE9,themeblack}'
set -g @nord-fg '#{?#{E:@nord-is-light},themeblack,themewhite}'
set -g @nord-muted '#{?#{E:@nord-is-light},themedarkgrey,themewhite}'
set -g @nord-secondary-bg '#{?#{E:@nord-is-light},##D8DEE9,themedarkgrey}'
set -g @nord-pill-fg '#{?#{E:@nord-is-light},themewhite,themeblack}'

set -g status-interval 1
set -g status on
set -g status-justify left
set -g status-style 'bg=#{E:@nord-bg},fg=#{E:@nord-fg}'
set -g status-left '#[fg=#{E:@nord-pill-fg},bg=themeblue,bold] #S '
set -g status-right '#[fg=#{E:@nord-fg},bg=#{E:@nord-secondary-bg}] %Y-%m-%d #[fg=#{E:@nord-muted},bg=#{E:@nord-secondary-bg},nobold,noitalics,nounderscore]| #[fg=#{E:@nord-fg},bg=#{E:@nord-secondary-bg}]%H:%M #[fg=#{E:@nord-pill-fg},bg=themecyan,bold] #H '

set -g window-status-format ' #[fg=#{E:@nord-muted},bg=#{E:@nord-secondary-bg}]#I #[fg=#{E:@nord-fg},bg=#{E:@nord-secondary-bg}]#W #F'
# Clear the default underline before the current window's leading padding.
setw -g window-status-current-style none
# The current window turns Aurora orange when a pane is zoomed.
set -g window-status-current-format ' #[fg=#{E:@nord-pill-fg},bg=#{?window_zoomed_flag,##D08770,themecyan},#{?#{E:@nord-is-light},bold,nobold},noitalics,nounderscore]#I #W #F'
set -g window-status-separator ''

set -g pane-border-style 'bg=default,fg=#{E:@nord-secondary-bg}'
set -g pane-active-border-style 'bg=default,fg=#{?#{E:@nord-is-light},##D08770,themeblue}'
set -g display-panes-colour '#{E:@nord-bg}'
set -g display-panes-active-colour '#{?#{E:@nord-is-light},##D08770,themedarkgrey}'
setw -g clock-mode-colour themecyan
set -g message-style 'bg=#{E:@nord-secondary-bg},fg=themecyan,fill=#{E:@nord-secondary-bg}'
set -g message-command-style 'bg=#{E:@nord-secondary-bg},fg=themecyan,fill=#{E:@nord-secondary-bg}'
